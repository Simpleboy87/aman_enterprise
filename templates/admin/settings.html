{% extends "admin/base.html" %}
{% block title %}Website Settings{% endblock %}
{% block page_title %}Website Settings{% endblock %}
{% block admin_content %}

<div class="card-industrial">
  <div class="card-body">
    <form method="POST" enctype="multipart/form-data">
      <h6 class="mb-3">Company Information</h6>
      <div class="row g-3 mb-4">
        <div class="col-md-6"><label class="form-label">Company Name</label><input type="text" name="company_name" class="form-control" value="{{ settings.company_name }}"></div>
        <div class="col-md-6"><label class="form-label">Logo (upload to replace)</label><input type="file" name="logo" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">Phone Number</label><input type="text" name="phone" class="form-control" value="{{ settings.phone }}"></div>
        <div class="col-md-4"><label class="form-label">WhatsApp Number (with country code, no +)</label><input type="text" name="whatsapp" class="form-control" value="{{ settings.whatsapp }}"></div>
        <div class="col-md-4"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ settings.email }}"></div>
        <div class="col-md-8"><label class="form-label">Address</label><input type="text" name="address" class="form-control" value="{{ settings.address }}"></div>
        <div class="col-md-4"><label class="form-label">Business Hours</label><input type="text" name="business_hours" class="form-control" value="{{ settings.business_hours }}"></div>
      </div>

      <h6 class="mb-3">Social & Map Links</h6>
      <div class="row g-3 mb-4">
        <div class="col-md-4"><label class="form-label">Facebook URL</label><input type="url" name="facebook_url" class="form-control" value="{{ settings.facebook_url }}"></div>
        <div class="col-md-4"><label class="form-label">Instagram URL</label><input type="url" name="instagram_url" class="form-control" value="{{ settings.instagram_url }}"></div>
        <div class="col-md-4"><label class="form-label">LinkedIn URL</label><input type="url" name="linkedin_url" class="form-control" value="{{ settings.linkedin_url }}"></div>
        <div class="col-12"><label class="form-label">Google Maps URL</label><input type="url" name="google_maps_url" class="form-control" value="{{ settings.google_maps_url }}"></div>
      </div>

      <h6 class="mb-3">Homepage Content</h6>
      <div class="row g-3 mb-4">
        <div class="col-md-6"><label class="form-label">Hero Heading</label><input type="text" name="hero_heading" class="form-control" value="{{ settings.hero_heading }}"></div>
        <div class="col-md-6"><label class="form-label">Hero Sub-heading</label><input type="text" name="hero_subheading" class="form-control" value="{{ settings.hero_subheading }}"></div>
        <div class="col-12"><label class="form-label">Hero Description</label><textarea name="hero_description" class="form-control" rows="2">{{ settings.hero_description }}</textarea></div>
        <div class="col-12"><label class="form-label">About Us Content</label><textarea name="about_content" class="form-control" rows="3">{{ settings.about_content }}</textarea></div>
      </div>

      <h6 class="mb-3">Statistics Counters</h6>
      <div class="row g-3 mb-4">
        <div class="col-md-3"><label class="form-label">Years Experience</label><input type="text" name="years_experience" class="form-control" value="{{ settings.years_experience }}"></div>
        <div class="col-md-3"><label class="form-label">Total Projects</label><input type="text" name="total_projects" class="form-control" value="{{ settings.total_projects }}"></div>
        <div class="col-md-3"><label class="form-label">Equipment Units</label><input type="text" name="equipment_units" class="form-control" value="{{ settings.equipment_units }}"></div>
        <div class="col-md-3"><label class="form-label">Customer Focus</label><input type="text" name="customer_focus" class="form-control" value="{{ settings.customer_focus }}"></div>
      </div>

      <button type="submit" class="btn btn-primary-industrial px-4">Save Settings</button>
    </form>
  </div>
</div>

<div class="card-industrial mt-4">
  <div class="card-body">
    <h6 class="mb-3">Change My Password</h6>
    <form method="POST" action="{{ url_for('admin.my_change_password') }}" class="row g-3">
      <div class="col-md-4"><label class="form-label">Current Password</label><input type="password" name="current_password" class="form-control" required></div>
      <div class="col-md-4"><label class="form-label">New Password</label><input type="password" name="new_password" class="form-control" minlength="6" required></div>
      <div class="col-md-4 d-flex align-items-end"><button class="btn btn-outline-secondary w-100" type="submit">Update Password</button></div>
    </form>
  </div>
</div>
{% endblock %}
